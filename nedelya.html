<style>
/* Вариант A «Чистый календарь»: нейтральный интерфейс, цвет несёт только сфера дела.
   Телефон: вкладки → полоска недели → дела выбранного дня. Широкий экран: 7 колонок. */
:root{
  --bg:#F7F7F5; --surface:#FFFFFF; --sunk:#EFEFEC; --ink:#1A1A1A; --muted:#5F5F5A; --line:#DEDED9; --edge:#8C8C86;
  --accent:#1A1A1A; --accent-ink:#FFFFFF; --warn:#B3261E; --ok:#1E7A3E;
  --home-bg:#FFF1CC; --home-fg:#8A5B00;
  --sport-bg:#DDF4E4; --sport-fg:#1E7A3E;
  --love-bg:#FFE1EB; --love-fg:#B0285A;
  --reno-bg:#FFE7D6; --reno-fg:#A2471A;
  --friends-bg:#ECE4FF; --friends-fg:#5934AF;
  --self-bg:#D8F1F0; --self-fg:#0E6B67;
  --other-bg:#ECECEA; --other-fg:#55554F;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121212; --surface:#1C1C1C; --sunk:#242424; --ink:#F2F2F0; --muted:#A8A8A2; --line:#333331; --edge:#8A8A84;
  --accent:#F2F2F0; --accent-ink:#121212; --warn:#FF8A80; --ok:#7BD69A;
  --home-bg:#3A2E10; --home-fg:#F2C55C; --sport-bg:#15331F; --sport-fg:#7BD69A; --love-bg:#3D1726; --love-fg:#FF8FB5;
  --reno-bg:#3D2214; --reno-fg:#FFA472; --friends-bg:#2A1F4A; --friends-fg:#B9A3FF; --self-bg:#0F3332; --self-fg:#6FD8D2;
  --other-bg:#2A2A28; --other-fg:#BDBDB6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1C1C1C; --sunk:#242424; --ink:#F2F2F0; --muted:#A8A8A2; --line:#333331; --edge:#8A8A84;
  --accent:#F2F2F0; --accent-ink:#121212; --warn:#FF8A80; --ok:#7BD69A;
  --home-bg:#3A2E10; --home-fg:#F2C55C; --sport-bg:#15331F; --sport-fg:#7BD69A; --love-bg:#3D1726; --love-fg:#FF8FB5;
  --reno-bg:#3D2214; --reno-fg:#FFA472; --friends-bg:#2A1F4A; --friends-fg:#B9A3FF; --self-bg:#0F3332; --self-fg:#6FD8D2;
  --other-bg:#2A2A28; --other-fg:#BDBDB6; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 var(--font);margin:0}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* шапка */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font:700 21px/1.15 var(--font);margin:0;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.nav{display:flex;align-items:center;gap:0;flex:none}
.icon-btn{width:34px;height:34px;border-radius:50%;border:0;background:none;font-size:20px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--sunk)}
.week-label{border:0;background:none;font-size:14px;color:var(--muted);padding:6px 2px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* вкладки Настя / Алина / Общее */
.tabs{display:flex;border-bottom:2px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:10px 0 9px;font-weight:600;font-size:15px;color:var(--muted);margin-bottom:-2px;border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* полоска недели */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.sd{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:var(--r);min-width:0}
.sd .dn{font-size:12px;color:var(--muted)}
.sd .dd{font-weight:650;font-size:17px;font-variant-numeric:tabular-nums}
.sd.today .dd{color:var(--warn)}
.sd[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sd[aria-pressed="true"] .dn,.sd[aria-pressed="true"].today .dd{color:var(--accent-ink)}
.sd.drop{outline:2px dashed var(--accent)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}

/* заголовок дня */
.dayhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dayhead b{font-size:17px}
.dayhead span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:10px;align-items:center}

/* карточка дела: целиком в цвете сферы */
.card{display:grid;grid-template-columns:22px 1fr;gap:3px 10px;align-items:start;padding:11px 12px;border-radius:var(--r);background:var(--cbg);cursor:pointer;min-width:0;border:1.5px solid transparent}
.card[draggable="true"]{cursor:grab}
.card.virtual{border-color:var(--cfg);border-style:dashed}
.check{width:22px;height:22px;border-radius:50%;border:2px solid var(--cfg);background:none;padding:0;display:grid;place-items:center;font-size:13px;color:var(--surface)}
.check[disabled]{cursor:default;opacity:.55}
.card.done .check{background:var(--cfg)}
.card.doing .check{border-style:dashed}
.t-title{font-weight:600;line-height:1.3;overflow-wrap:anywhere;color:var(--ink)}
.card.done .t-title{text-decoration:line-through;color:var(--muted)}
.t-meta{grid-column:2;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:13px;color:var(--ink)}
.lab{color:var(--cfg);font-weight:700}
.allday{font-weight:600}
.pill{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid var(--cfg);color:var(--cfg)}
.moved{color:var(--warn);font-weight:700}
.due{font-weight:500}
.due.bad{color:var(--warn);font-weight:700}
.late-btn{grid-column:2;justify-self:start;margin-top:4px;border:1px solid var(--warn);background:var(--surface);border-radius:99px;font-size:12px;padding:3px 10px;color:var(--warn)}
.card.secret{--cbg:var(--sunk);--cfg:var(--muted);cursor:default;border:1.5px dashed var(--edge)}
.card.secret .t-title{color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.lock{width:12px;height:12px;flex:none}
.who{width:18px;height:18px;border-radius:50%;flex:none}
.who.letter{display:inline-grid;place-items:center;font-size:10px;font-weight:700;background:var(--ink);color:var(--surface)}

/* без даты */
.inbox{border:1.5px dashed var(--line);border-radius:var(--r)}
.inbox.drop{border-color:var(--accent)}
.inbox-row{width:100%;border:0;background:none;padding:12px;display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:600}
.inbox-row span{color:var(--muted);font-weight:400}
.inbox .list{padding:0 10px 10px}

/* легенда */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}

/* кнопка «+» */
.fab{position:fixed;right:max(20px,calc(50vw - 300px));bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 18px rgb(0 0 0/.22);z-index:5}

.notice{background:var(--surface);border:1px dashed var(--edge);border-radius:var(--r);padding:10px 14px;font-size:13px;color:var(--ink)}
.ghost{border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500}
.primary{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 18px;font-weight:600}

/* широкий экран: вся неделя колонками */
.week{display:none}
@media (min-width:900px){
  .wrap{max-width:1320px}
  .strip,#dayView{display:none}
  .week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
  .col{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:240px}
  .col.today{border:2px solid var(--accent);padding:9px}
  .col.drop{outline:2px dashed var(--accent)}
  .col-head{display:flex;justify-content:space-between;align-items:baseline}
  .col-head b{font-size:16px}
  .col-head span{font-size:12px;color:var(--muted)}
  .col .add{border:1px dashed var(--line);background:none;border-radius:8px;padding:6px;color:var(--muted);font-size:13px;margin-top:auto}
  .card{grid-template-columns:20px 1fr;padding:9px 10px;gap:3px 8px}
  .check{width:20px;height:20px}
  .fab{right:24px}
}

/* модалка */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);display:grid;place-items:center;padding:16px;z-index:10}
.sheet{background:var(--surface);border-radius:16px;width:min(520px,100%);max-height:calc(100% - 32px);overflow:auto;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgb(0 0 0/.3)}
.sheet h3{font-size:18px;margin:0}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>.field{flex:1 1 130px;min-width:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{background:var(--surface);border:1px solid var(--edge);border-radius:10px;padding:9px 10px;width:100%;min-width:0;max-width:100%;display:block;font-size:16px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.field>label.check-row{text-transform:none;letter-spacing:0;font-size:14px;font-weight:400;color:var(--ink);margin-top:2px}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--edge);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.chip.sph{background:var(--cbg);border-color:transparent;color:var(--ink)}
.chip.sph[aria-pressed="true"]{border:2px solid var(--cfg);color:var(--cfg);font-weight:700;padding:5px 11px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.danger{border:1px solid var(--edge);background:none;color:var(--warn);border-radius:999px;padding:7px 14px}
.ro-note,.info{font-size:13px;background:var(--sunk);border-radius:10px;padding:8px 10px}
.info{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.check-row{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:20}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Неделя на двоих</h1>
    <div class="nav">
      <button class="icon-btn" id="prev" aria-label="Предыдущая неделя">‹</button>
      <button class="week-label" id="weekLabel" title="Вернуться к сегодня"></button>
      <button class="icon-btn" id="next" aria-label="Следующая неделя">›</button>
    </div>
  </header>
  <nav class="tabs" id="filter" aria-label="Чьи дела"></nav>
  <div class="notice" id="notice" hidden></div>
  <section id="weekView" style="display:flex;flex-direction:column;gap:14px">
    <div class="strip" id="strip"></div>
    <div id="dayView" style="display:flex;flex-direction:column;gap:10px"></div>
    <div class="week" id="week"></div>
    <div class="inbox" id="inbox"></div>
    <div class="legend" id="legend"></div>
  </section>
  <button class="fab" id="addBtn" aria-label="Добавить дело">+</button>
</div>

<script>
(() => {
const SPH = {
  home:{label:"Дом"},
  sport:{label:"Спорт"},
  love:{label:"Мы вдвоём"},
  reno:{label:"Ремонт"},
  friends:{label:"Друзья"},
  self:{label:"Личное"},
};
// для отображения старых дел: сфера «Работа» больше не выбирается, но такие дела показываются серыми
const SPH_ALL = {...SPH, work:{label:"Работа"}};
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON = ["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const STATUS = {todo:"Надо сделать", doing:"В процессе", done:"Готово"};

const S = {
  db:null, me:null, local:false,
  members:new Set(), tasks:new Map(), series:new Map(), // tasks: key owner|id
  profiles:{}, people:[], weekStart:monday(new Date()), filter:"p0", view:"week", dragKey:null,
};

/* ---------- даты ---------- */
function pad(n){return String(n).padStart(2,"0")}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function parse(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;return addDays(x,-k)}
function today(){return iso(new Date())}
function dowIdx(ds){return (parse(ds).getDay()+6)%7}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/864e5)}
function short(ds){const d=parse(ds);return d.getDate()+" "+MON[d.getMonth()]}
function fmtMin(m){m=Math.round(m||0);if(!m)return "0 мин";const h=Math.floor(m/60),r=m%60;return (h?h+" ч":"")+(h&&r?" ":"")+(r?r+" мин":"")}
function fmtH(m){const h=(m||0)/60;return h>=10?Math.round(h)+" ч":(Math.round(h*10)/10).toString().replace(".",",")+" ч"}
function daysLabel(days){const s=[...days].sort();if(s.length===7)return "каждый день";if(s.join()==="0,1,2,3,4")return "по будням";if(s.join()==="5,6")return "по выходным";return s.map(i=>DOW[i]).join(", ")}

/* ---------- dom ---------- */
function h(tag,attrs,...kids){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs||{})){if(v==null||v===false)continue;if(k==="class")el.className=v;else if(k==="text")el.textContent=v;else if(k.startsWith("on"))el.addEventListener(k.slice(2),v);else if(k==="style")el.setAttribute("style",v);else el.setAttribute(k,v===true?"":v)}for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:document.createTextNode(c))}return el}
const $=id=>document.getElementById(id);
function toast(msg){const t=h("div",{class:"toast",text:msg,role:"status"});document.body.append(t);setTimeout(()=>t.remove(),2200)}
function color(s){return `var(--${SPH[s]?s:"other"}-fg)`}

/* ---------- данные ---------- */
const key=(o,id)=>o+"|"+id;
// Чьё дело: индекс человека из настроек people. Пустой id = «второй человек» (все, кто не из списка).
function personIdx(owner){
  if(S.local)return 0;
  const i=S.people.findIndex(p=>p.id&&"tg"+p.id===owner);
  if(i>=0)return i;
  const j=S.people.findIndex(p=>!p.id);
  return j>=0?j:-1;
}
function passes(t){
  if(S.filter==="both")return t.who==="both";
  const n=+S.filter.slice(1);
  return t.who==="both"||personIdx(t.owner)===n;
}
// чужой секрет: видно только слово «Секрет»
function hidden(t){return !!t.secret&&!S.local&&t.owner!==S.me}
// реальные дела (без пропущенных повторов)
function realTasks(){return [...S.tasks.values()].filter(t=>!t.skipped)}
// виртуальные экземпляры повторяющихся дел на конкретный день
function instancesOn(ds){
  const out=[];
  for(const s of S.series.values()){
    if(!s.days||!s.days.includes(dowIdx(ds)))continue;
    if(s.start&&s.start>ds)continue;
    if(s.end&&s.end<ds)continue;
    const id=s.id+"_"+ds;
    if(S.tasks.has(key(s.owner,id)))continue; // уже есть реальная запись
    out.push({id,owner:s.owner,title:s.title,sphere:s.sphere,time:s.time||"",allDay:!!s.allDay,secret:!!s.secret,plan:s.plan||0,who:s.who||"me",note:s.note||"",
      date:ds,due:"",status:"todo",moved:0,seriesId:s.id,seriesDate:ds,virtual:true,createdAt:s.createdAt||0});
  }
  return out;
}
function tasksOn(ds){return realTasks().filter(t=>t.date===ds).concat(instancesOn(ds)).filter(passes)}
function weekList(){const out=[];for(let i=0;i<7;i++)out.push(...tasksOn(iso(addDays(S.weekStart,i))));return out}
function isOwn(t){return S.local||t.owner===S.me}
function canEdit(t){return !hidden(t)&&(isOwn(t)||t.who==="both")}
function dueBroken(t){
  if(!t.due)return false;
  if(t.status==="done")return t.doneAt?iso(new Date(t.doneAt))>t.due:false;
  return t.due<today();
}

function coll(name){return S.db.collection(name)}
// Понятное объяснение ошибки базы + технический код, чтобы можно было найти причину
function errText(e){
  const code=(e&&e.code)||"unknown";
  const why={
    "permission-denied":"база не разрешает запись: проверь вкладку Rules в Firebase",
    "unavailable":"нет связи с базой: проверь интернет или попробуй с VPN",
    "invalid-argument":"в деле есть недопустимые данные",
    "not-found":"база не найдена: проверь, что она называется (default)",
    "failed-precondition":"база ещё не готова или выключена",
    "resource-exhausted":"закончился бесплатный лимит на сегодня",
    "unauthenticated":"база требует входа",

  const d={...s};
  let days=[...(s.days||[])];
  const title=h("input",{type:"text",id:"s-title",value:d.title,maxlength:"140"});
  const timeI=h("input",{type:"time",id:"s-time",value:d.time||""});
  const planI=h("input",{type:"number",id:"s-plan",min:"0",step:"5",value:d.plan||""});
  const note=h("textarea",{id:"s-note"},d.note||"");
  const own=isOwn(s);
  const stopZone=h("div",{class:"row"});
  let close;
  const form=h("form",{style:"display:contents",onsubmit:e=>{
      e.preventDefault();const t=title.value.trim();if(!t){title.focus();return}
      if(!days.length){toast("Выбери хотя бы один день");return}
      saveSeries({...d,title:t,time:timeI.value,plan:+planI.value||0,note:note.value.trim(),days:days.sort()});close();toast("Повторение обновлено")}},
    h("h3",{text:"Повторяющееся дело"}),
    h("div",{class:"muted",style:"font-size:13px",text:"Изменения применятся ко всем дням, которые ещё не отмечены и не поправлены вручную."}),
    h("div",{class:"field"},h("label",{for:"s-title",text:"Что сделать"}),title),
    h("div",{class:"field"},h("span",{class:"lbl",text:"Сфера"}),chipGroup(Object.entries(SPH).map(([k,v])=>[k,v.label,color(k)]),d.sphere,v=>d.sphere=v)),
    h("div",{class:"field"},h("span",{class:"lbl",text:"Дни"}),daysPicker(days,v=>days=v)),
    h("div",{class:"row"},
      h("div",{class:"field"},h("label",{for:"s-time",text:"Время"}),timeI),
      h("div",{class:"field"},h("label",{for:"s-plan",text:"План, мин"}),planI)),
    own?h("div",{class:"field"},h("span",{class:"lbl",text:"Чьё"}),chipGroup([["me","Моё"],["both","Общее"]],d.who||"me",v=>d.who=v)):null,
    h("div",{class:"field"},h("label",{for:"s-note",text:"Заметка"}),note),
    h("div",{class:"actions"},own?stopZone:h("span"),h("button",{type:"submit",class:"primary",text:"Сохранить"})));
  if(own){
    const ask=()=>stopZone.replaceChildren(h("span",{class:"muted",style:"font-size:13px;align-self:center",text:"Больше не повторять с завтрашнего дня?"}),
      h("button",{type:"button",class:"danger",text:"Да",onclick:()=>{saveSeries({...s,end:today()});close();toast("Повторение остановлено")}}),
      h("button",{type:"button",class:"ghost",text:"Нет",onclick:reset}));
    const reset=()=>stopZone.replaceChildren(h("button",{type:"button",class:"danger",text:"Остановить повторение",onclick:ask}));
    reset();
  }
  close=modal(form);
}

function openDone(t){
  const f=h("input",{type:"number",id:"d-fact",min:"0",step:"5",value:t.plan||30});
  let close;
  const form=h("form",{style:"display:contents",onsubmit:e=>{e.preventDefault();saveTask({...t,status:"done",fact:+f.value||0,doneAt:Date.now(),doneBy:S.me});close();toast("Готово")}},
    h("h3",{text:"Сколько это заняло?"}),
    h("div",{class:"muted",text:t.title+(t.plan?` · план ${fmtMin(t.plan)}`:"")}),
    h("div",{class:"field"},h("label",{for:"d-fact",text:"Факт, мин"}),f,
      h("div",{class:"chips"},[15,30,45,60,90,120,180].map(m=>h("button",{type:"button",class:"chip",text:fmtMin(m),onclick:()=>{f.value=m}})))),
    h("div",{class:"actions"},h("button",{type:"button",class:"ghost",text:"Отмена",onclick:()=>close()}),h("button",{type:"submit",class:"primary",text:"Отметить сделанным"})));
  close=modal(form);
}

/* ---------- кнопки ---------- */
$("prev").onclick=()=>{S.weekStart=addDays(S.weekStart,-7);if(S.day)S.day=iso(addDays(parse(S.day),-7));render()};
$("next").onclick=()=>{S.weekStart=addDays(S.weekStart,7);if(S.day)S.day=iso(addDays(parse(S.day),7));render()};
$("weekLabel").onclick=()=>{S.weekStart=monday(new Date());S.day=today();render()};
window.matchMedia("(min-width:900px)").addEventListener("change",()=>render());
dropZone($("inbox"),"");
$("addBtn").onclick=()=>{if(wide()){const td=today(),ws=iso(S.weekStart),we=iso(addDays(S.weekStart,6));openEditor(null,td>=ws&&td<=we?td:ws)}else openEditor(null,S.day||today())};

/* ---------- Telegram + Firebase ---------- */
function goLocal(msg){
  S.local=true;S.me="local";
  const n=$("notice");n.hidden=false;n.textContent=msg;render();
}
function showError(msg){const n=$("notice");n.hidden=false;n.textContent=msg}
function lockScreen(id){
  const wrap=document.querySelector(".wrap");
  const idBox=h("span",{class:"mono",style:"font-size:20px;user-select:all",text:id});
  wrap.replaceChildren(h("div",{class:"panel",style:"max-width:440px;margin:15vh auto 0;text-align:center;align-items:center"},
    h("h1",{text:"Это личный планер"}),
    h("p",{class:"muted",style:"margin:0",text:"Открыть его могут только те, кого добавила владелица. Если тебя должны пустить, отправь ей этот номер:"}),
    idBox,
    h("button",{class:"ghost",text:"Скопировать номер",onclick:async e=>{
      try{await navigator.clipboard.writeText(id);e.target.textContent="Скопировано"}
      catch(_){const r=document.createRange();r.selectNodeContents(idBox);const s=getSelection();s.removeAllRanges();s.addRange(r)}}})));
}
(function init(){
  const tg=window.Telegram&&window.Telegram.WebApp;
  if(tg){
    try{tg.ready();tg.expand()}catch(e){}
    if(tg.colorScheme)document.documentElement.setAttribute("data-theme",tg.colorScheme);
    try{tg.onEvent("themeChanged",()=>document.documentElement.setAttribute("data-theme",tg.colorScheme))}catch(e){}
  }
  const cfg=window.PLANNER_CONFIG||{};
  S.people=(Array.isArray(cfg.people)&&cfg.people.length?cfg.people:[{id:"",name:"Я"}])
    .map(p=>({id:String(p.id||"").trim(),name:String(p.name||"").trim()}));
  render();
  const tgUser=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user;
  if(!tgUser){goLocal("Открой планер через бота в Telegram, чтобы дела сохранялись. Сейчас это пробный режим: всё пропадёт после перезагрузки.");return}
  const allowed=[...(cfg.allowed||[]),...S.people.map(p=>p.id)].map(String).filter(x=>/^\d+$/.test(x));
  if(allowed.length&&!allowed.includes(String(tgUser.id))){lockScreen(String(tgUser.id));return}
  if(!window.firebase||!cfg.firebase||String(cfg.firebase.apiKey).includes("ВСТАВЬ")){goLocal("База ещё не подключена: вставь настройки Firebase в начало файла (шаг 2 инструкции).");return}

  if(typeof firebase.firestore!=="function"){showError("Не загрузилась часть Firebase, отвечающая за базу. Проверь интернет или попробуй с VPN, затем открой планер заново.");return}
  try{connect(tgUser,cfg)}catch(e){console.error(e);showError("Не получилось подключиться к базе: "+(e&&e.message||e))}
})();
function connect(tgUser,cfg){
  firebase.initializeApp(cfg.firebase);
  const fs=firebase.firestore();
  // Long polling вместо потокового соединения: надёжнее внутри Telegram, за VPN и прокси.
  // ignoreUndefinedProperties: пустые поля не ломают сохранение.
  try{fs.settings({experimentalForceLongPolling:true,ignoreUndefinedProperties:true,merge:true})}catch(e){console.warn(e)}
  const root=fs.collection("planners").doc(cfg.space);
  S.db=root;
  S.me="tg"+tgUser.id;
  S.filter="p"+Math.max(0,personIdx(S.me));
  const myName=[tgUser.first_name,tgUser.last_name].filter(Boolean).join(" ")||"Я";
  S.members.add(S.me);S.profiles[S.me]={name:myName};
  render();

  root.collection("members").doc(S.me).set({name:myName,seenAt:Date.now()},{merge:true})
    .then(()=>{S.connected=true})
    .catch(e=>{console.error(e);showError(errText(e).replace("Не сохранилось","Нет связи с базой"))});
  // Если за 15 секунд база так и не ответила — скорее всего, её блокирует сеть
  setTimeout(()=>{if(!S.connected&&$("notice").hidden)showError("База не отвечает уже 15 секунд. Скорее всего, сеть блокирует сервисы Google: попробуй с VPN или другим интернетом (Wi-Fi / мобильный).")},15000);
  root.collection("members").onSnapshot(snap=>{
    snap.forEach(d=>{S.members.add(d.id);S.profiles[d.id]={name:(d.data()||{}).name||""}});
    render();
  },()=>{});
  root.collection("tasks").onSnapshot(snap=>{
    S.tasks.clear();
    snap.forEach(doc=>{const b=doc.data();if(b&&b.owner)S.tasks.set(key(b.owner,doc.id),{...b,id:doc.id})});
    render();
  },e=>{console.error(e);showError(errText(e).replace("Не сохранилось","Не читаются дела"))});
  root.collection("series").onSnapshot(snap=>{
    S.series.clear();
    snap.forEach(doc=>{const b=doc.data();if(b&&b.owner)S.series.set(doc.id,{...b,id:doc.id})});
    render();
  },()=>{});
}
})();
